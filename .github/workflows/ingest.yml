# Ingest (T4.4): every 6 h, RSS into the store, DB back to the orphan `data`
# branch (IMPLEMENTATION_GUIDE.md §2, §9 2026-10-23). No scoring here:
# daily.yml's `newsmood report` scores everything stored.
name: ingest

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: newsmood-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # torch is a core dependency; CPU-only so the runner skips CUDA wheels.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Fetch DB from data branch
        run: |
          git fetch --depth=1 origin +refs/heads/data:refs/remotes/origin/data
          git show origin/data:newsmood.db > data/newsmood.db

      - name: Configure bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ingest
        run: newsmood ingest

      - name: Push DB to data branch
        run: |
          bash .github/scripts/push_db.sh "data: ingest $(date -u +%Y-%m-%dT%H:%MZ)"
