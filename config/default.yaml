# newsmood — default configuration
# Thresholds, feed URLs, model revision and band cutoffs live here.
# Never hardcode one of these in a module.

dataset:
  # Financial PhraseBank. See CLAUDE.md — never train or evaluate on
  # a different agreement config than phrasebank_config.
  repo_id: takala/financial_phrasebank
  phrasebank_config: sentences_75agree
  agreement_configs:
    - sentences_allagree
    - sentences_75agree
    - sentences_66agree
    - sentences_50agree
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  tokenizer: distilbert-base-uncased
  splits_dir: data/splits
  sample_size: 200
  sample_path: data/sample/headlines_200.jsonl

vader:
  # Compound-score thresholds, ported as-is from the archived repo.
  # compound >= positive_threshold -> positive
  # compound <= negative_threshold -> negative
  # else -> neutral
  positive_threshold: 0.05
  negative_threshold: -0.05

logreg:
  # TfidfVectorizer + LogisticRegression, ported from the archived repo.
  # max_features raised 1000 -> 20000 per IMPLEMENTATION_GUIDE.md §3.
  # random_state is not set here — it reuses dataset.seed, so the split
  # and the model never drift to two different seeds.
  ngram_range: [1, 3]
  min_df: 2
  max_df: 0.95
  max_features: 20000
  class_weight: balanced
  max_iter: 1000
  artifact_dir: models/baselines

ingest:
  # RSS feeds, fetched sequentially. Each was verified live on 2026-09-24
  # before being listed here — see docs/sources.md for per-feed findings.
  user_agent: "newsmood/0.1 (financial headline sentiment research; https://github.com/kkrit-tinna/Newsmood)"
  timeout_seconds: 15
  delay_seconds: 2
  # Order matters: on a title_norm collision the first feed listed keeps the
  # row (source, url, summary). yahoo-finance goes last — it has no summaries
  # and is the stalest feed. IMPLEMENTATION_GUIDE.md §9, 2026-09-25.
  feeds:
    - name: cnbc-finance
      url: https://www.cnbc.com/id/10000664/device/rss/rss.html
    - name: marketwatch-top
      url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    - name: yahoo-finance
      url: https://finance.yahoo.com/news/rssindex

store:
  # One SQLite file, gitignored (*.db and data/*). Relative to the working
  # directory, like splits_dir. Override with NEWSMOOD_STORE__DB_PATH.
  db_path: data/newsmood.db

training:
  # Base model is dataset.tokenizer — max_length was measured under it, so
  # there is no second key to drift. Token lengths over all 3,453 rows:
  # mean 30.4, p95 58, p99 69, max 150. Truncates 3 rows (1 train, 2 val,
  # 0 test). Batches are padded dynamically to their own longest row, so the
  # cap costs nothing on typical batches. IMPLEMENTATION_GUIDE.md §9, 2026-09-27.
  max_length: 96
  # IMPLEMENTATION_GUIDE.md T2.2. AdamW lr/weight decay and 10% linear warmup
  # are the archived repo's values, kept as-is (§3).
  epochs: 3
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  # With 3 epochs and patience 3 this cannot fire; it is wired in so a longer
  # run stops and restores the best-val-loss weights.
  early_stopping_patience: 3
  early_stopping_min_delta: 0.001
  # save_pretrained model + tokenizer and history.json. Gitignored (/models/).
  output_dir: models/local

model:
  # The fine-tuned DistilBERT that `newsmood score` uses, from the Hub (T2.4).
  # Pinned to a full 40-char commit SHA, never main or a branch: a re-upload
  # would otherwise change every label without the package version changing.
  # config.py rejects anything else. Downloaded once by models/loader.py into
  # cache_dir, never read from training.output_dir.
  repo_id: kkrit-tinna/newsmood-distilbert-financial
  revision: be7b809e0d8f7bd50e77d902aee199363b7e2a66
  cache_dir: ~/.cache/newsmood
  # Headlines per forward pass in `newsmood score` (T2.5). Truncation reuses
  # training.max_length, the cap the model was trained with.
  batch_size: 32

finbert:
  # Zero-shot reference ceiling for T2.3, scored on CPU for reproducibility.
  # Pinned commit, never main: a re-upload would silently change the row.
  # Its id2label order differs from ours and is mapped by name in
  # baselines/finbert.py. ~440 MB, cached by transformers under ~/.cache/huggingface.
  repo_id: ProsusAI/finbert
  revision: 4556d13015211d73dccd3fdd39d39232506f3e43
  batch_size: 32
