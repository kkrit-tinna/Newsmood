# newsmood — default configuration
# Thresholds, feed URLs, model revision and band cutoffs live here.
# Never hardcode one of these in a module.

dataset:
  # Financial PhraseBank. See CLAUDE.md — never train or evaluate on
  # a different agreement config than phrasebank_config.
  repo_id: takala/financial_phrasebank
  phrasebank_config: sentences_75agree
  agreement_configs:
    - sentences_allagree
    - sentences_75agree
    - sentences_66agree
    - sentences_50agree
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  tokenizer: distilbert-base-uncased
  splits_dir: data/splits
  sample_size: 200
  sample_path: data/sample/headlines_200.jsonl

vader:
  # Compound-score thresholds, ported as-is from the archived repo.
  # compound >= positive_threshold -> positive
  # compound <= negative_threshold -> negative
  # else -> neutral
  positive_threshold: 0.05
  negative_threshold: -0.05

logreg:
  # TfidfVectorizer + LogisticRegression, ported from the archived repo.
  # max_features raised 1000 -> 20000 per IMPLEMENTATION_GUIDE.md §3.
  # random_state is not set here — it reuses dataset.seed, so the split
  # and the model never drift to two different seeds.
  ngram_range: [1, 3]
  min_df: 2
  max_df: 0.95
  max_features: 20000
  class_weight: balanced
  max_iter: 1000
  artifact_dir: models/baselines

ingest:
  # RSS feeds, fetched sequentially. Each was verified live on 2026-09-24
  # before being listed here — see docs/sources.md for per-feed findings.
  user_agent: "newsmood/0.1 (financial headline sentiment research; https://github.com/kkrit-tinna/Newsmood)"
  timeout_seconds: 15
  delay_seconds: 2
  # Order matters: on a title_norm collision the first feed listed keeps the
  # row (source, url, summary). IMPLEMENTATION_GUIDE.md §9, 2026-09-25.
  # yahoo-finance was removed on 2026-10-09 (HTTP 404 on Oct 7 and 8); its
  # stored rows stay. investing-stocks joined the same day, last in order.
  # Its pubDate carries no offset and is UTC (docs/sources.md); feedparser
  # reads an offset-less date as UTC, so no conversion is needed.
  feeds:
    - name: cnbc-finance
      url: https://www.cnbc.com/id/10000664/device/rss/rss.html
    - name: marketwatch-top
      url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    - name: investing-stocks
      url: https://www.investing.com/rss/news_25.rss

gates:
  # Quality gates (T3.5): block broken runs, disclose thin days.
  # IMPLEMENTATION_GUIDE.md T3.5 and §9, 2026-10-09.
  # Block: pipeline_fresh fails when the newest stored fetched_at is
  # max_feed_staleness_hours or more old (so 0 always blocks); today's run only.
  # Disclose: stale_feed fires for a responding feed whose newest item is that
  # old. Both use this one key.
  max_feed_staleness_hours: 36
  # Disclose when one source's share of the day's headlines is above this.
  max_single_source_share: 0.70
  # Disclose when the share of rows below index.low_confidence is above this.
  max_low_confidence_rate: 0.50
  # thin_day has no key here: it reads explain.min_headlines (8), the floor
  # below which the day is too thin to cluster. One key, so they can't drift.

store:
  # One SQLite file, gitignored (*.db and data/*). Relative to the working
  # directory, like splits_dir. Override with NEWSMOOD_STORE__DB_PATH.
  db_path: data/newsmood.db

training:
  # Base model is dataset.tokenizer — max_length was measured under it, so
  # there is no second key to drift. Token lengths over all 3,453 rows:
  # mean 30.4, p95 58, p99 69, max 150. Truncates 3 rows (1 train, 2 val,
  # 0 test). Batches are padded dynamically to their own longest row, so the
  # cap costs nothing on typical batches. IMPLEMENTATION_GUIDE.md §9, 2026-09-27.
  max_length: 96
  # IMPLEMENTATION_GUIDE.md T2.2. AdamW lr/weight decay and 10% linear warmup
  # are the archived repo's values, kept as-is (§3).
  epochs: 3
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  # With 3 epochs and patience 3 this cannot fire; it is wired in so a longer
  # run stops and restores the best-val-loss weights.
  early_stopping_patience: 3
  early_stopping_min_delta: 0.001
  # save_pretrained model + tokenizer and history.json. Gitignored (/models/).
  output_dir: models/local

model:
  # The fine-tuned DistilBERT that `newsmood score` uses, from the Hub (T2.4).
  # Pinned to a full 40-char commit SHA, never main or a branch: a re-upload
  # would otherwise change every label without the package version changing.
  # config.py rejects anything else. Downloaded once by models/loader.py into
  # cache_dir, never read from training.output_dir.
  repo_id: kkrit-tinna/newsmood-distilbert-financial
  revision: be7b809e0d8f7bd50e77d902aee199363b7e2a66
  cache_dir: ~/.cache/newsmood
  # Headlines per forward pass in `newsmood score` (T2.5). Truncation reuses
  # training.max_length, the cap the model was trained with.
  batch_size: 32

finbert:
  # Zero-shot reference ceiling for T2.3, scored on CPU for reproducibility.
  # Pinned commit, never main: a re-upload would silently change the row.
  # Its id2label order differs from ours and is mapped by name in
  # baselines/finbert.py. ~440 MB, cached by transformers under ~/.cache/huggingface.
  repo_id: ProsusAI/finbert
  revision: 4556d13015211d73dccd3fdd39d39232506f3e43
  batch_size: 32

index:
  # Daily mood index (T3.3). A day is a calendar day in this IANA zone,
  # assigned by published_at; zoneinfo handles the EDT/EST switch.
  timezone: America/New_York
  # Informational only: rows below this confidence are counted in
  # n_low_conf and still weighted into the mood by their confidence.
  low_confidence: 0.60

lede_bands:
  # Strength word for the report header (T4.2) and the lede (T4.2b), applied
  # to |mood| as displayed (1 decimal). Each bound is exclusive: |mood| < flat
  # is "roughly flat", < mild "mildly", < moderate "moderately", else "strongly".
  flat: 5
  mild: 15
  moderate: 35

report:
  # Recommended articles (T4.2): top-k headlines per sentiment by model
  # certainty. Ranks certainty, not importance; the section header says so.
  recommended:
    negative: 3
    positive: 3
    neutral: 2
  # Pie slice colors, one per sentiment (Okabe-Ito, colorblind-safe; no
  # red/green pair). report_data.py attaches each to its slice so a color
  # follows the sentiment, never the slice's position.
  colors:
    negative: "#D55E00"
    positive: "#0072B2"
    neutral: "#999999"
  # Where `newsmood report` writes {date}.md (T4.3). Committed, unlike the
  # store. Relative to the working directory, like store.db_path. Override
  # with NEWSMOOD_REPORT__OUTPUT_DIR.
  output_dir: reports

lede:
  # The computed lede under "What happened" (T4.2b, block 0). Strength words
  # come from lede_bands above, shared with the header.
  # Change slot: delta vs the previous session, on displayed 1-decimal moods.
  # Omitted when |delta| < change_min_delta (so exactly 5.0 is shown).
  change_min_delta: 5
  # The previous session is the most recent day in D-1 .. D-N (inclusive)
  # with a stored daily_index row and at least prev_session_min_headlines.
  # Measured Sep 21-Oct 7: days with an ingest run had 12-29 headlines, days
  # without had 1-4, so 5 separates them. Weekend days qualify if they pass.
  prev_session_lookback_days: 5
  prev_session_min_headlines: 5

explain:
  # Themes under "What happened" (T4.2b, blocks 2-3).
  # window: TfidfVectorizer fit at report time on day D plus the previous
  # background_days of stored headlines. phrasebank: the T1.4 vectorizer in
  # logreg.artifact_dir, dev-only (models/ is gitignored). IMPLEMENTATION_GUIDE.md §9, 2026-10-07.
  vectorizer: window
  # Unigram OOV share of today's headlines against the chosen vocabulary.
  # Above this, stderr suggests switching to window (operator advice only).
  oov_warn: 0.20
  background_days: 30
  # Floors. Below any of them block 3 prints "no clear theme today".
  # Calibrated on the six stored days with >= 8 headlines (Sep 22-Oct 7,
  # one ingest a day): every cluster at 0.6 was one story or one tight topic;
  # 0.7 joined unrelated stories on "wall street". Re-check after T4.4 ingests
  # every 4-6 h. IMPLEMENTATION_GUIDE.md §9, 2026-10-07.
  min_headlines: 8                  # day total; below it nothing is clustered
  min_cluster_size: 3               # 2 is often one story syndicated twice
  cluster_purity: 0.70              # share of a cluster's dominant sentiment, for the lede driver
  cluster_distance: 0.6             # cosine distance threshold, complete linkage
  # A cluster is named only by terms in at least this many of its own rows.
  min_term_headlines: 2
  # window mode's TfidfVectorizer. min_df counts headlines across the whole
  # fit (today + background), so a word used once in the window drops out.
  window_ngram_range: [1, 2]
  window_min_df: 2
  # Terms naming each cluster.
  cluster_name_terms: 3
