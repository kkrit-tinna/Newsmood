[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsmood"
version = "0.1.0"
description = "Financial news sentiment CLI: fine-tuned DistilBERT labels RSS headlines, a daily markdown report is rendered from computed evidence."
requires-python = ">=3.11"
dependencies = [
    "typer",
    "feedparser",
    "pydantic-settings",
    "pyyaml",
    "vaderSentiment",
    "scikit-learn>=1.9,<2",
]

[project.optional-dependencies]
train = [
    "torch",
    "transformers",
    "datasets",
]
dev = [
    "pytest",
]

[project.scripts]
newsmood = "newsmood.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
